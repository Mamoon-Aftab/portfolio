<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>

  <!-- Subtle glow circle inside -->
  <circle cx="50" cy="50" r="38" fill="rgba(255,255,255,0.08)"/>

  <!-- Inner border -->
  <rect x="6" y="6" width="88" height="88" rx="20"
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Stylish M -->
  <text x="50" y="70"
        font-family="Poppins, Arial Black, sans-serif"
        font-size="58"
        font-weight="900"
        fill="url(#textGrad)"
        text-anchor="middle"
        letter-spacing="-3"
        filter="url(#glow)">M</text>

  <!-- Small dot accent -->
  <circle cx="78" cy="22" r="4" fill="#e9d5ff" opacity="0.9"/>
</svg>